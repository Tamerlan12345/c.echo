# LiveKit Self-Hosted configuration for Railway
# Mount this file at /etc/livekit.yaml in the container.
#
# Railway specifics:
# - No UDP ingress. ICE-TCP fallback is mandatory.
# - TCP Proxy gives a random external port. LiveKit must listen on the SAME port
#   that Railway exposes publicly, because LiveKit advertises its listen port in
#   ICE candidates. Set LIVEKIT_TCP_PORT and Railway TCP Proxy target port to the
#   same value (the port Railway shows you in dashboard).
# - node_ip must be the public IP of Railway's TCP Proxy edge (not the container
#   egress IP), otherwise advertised ICE candidates point nowhere.

port: 7880

rtc:
  # Must equal the public TCP port Railway assigned for this service.
  tcp_port: ${LIVEKIT_TCP_PORT}

  # Public IP that Railway TCP Proxy resolves to. Look up via:
  #   nslookup <your-proxy-host>.proxy.rlwy.net
  node_ip: ${LIVEKIT_NODE_IP}

  # UDP is unreachable from outside on Railway — keep range minimal.
  # Range still required by LiveKit, but it's effectively unused.
  port_range_start: 50000
  port_range_end: 50010

  # Disabled: we provide node_ip explicitly. Auto-detect resolves the container
  # egress IP, which is different from the proxy edge IP clients connect to.
  use_external_ip: false

  turn_servers:
    - host: "global.relay.metered.ca"
      port: 80
      protocol: "udp"
      username: ${EXTERNAL_TURN_USERNAME}
      credential: ${EXTERNAL_TURN_CREDENTIAL}
    - host: "global.relay.metered.ca"
      port: 443
      protocol: "udp"
      username: ${EXTERNAL_TURN_USERNAME}
      credential: ${EXTERNAL_TURN_CREDENTIAL}
    - host: "global.relay.metered.ca"
      port: 443
      protocol: "tls"
      username: ${EXTERNAL_TURN_USERNAME}
      credential: ${EXTERNAL_TURN_CREDENTIAL}

# CORS — allow frontend origin to validate tokens via HTTP before WebSocket upgrade
allowed_origins:
  - ${LIVEKIT_ALLOWED_ORIGINS}
  - "http://localhost:3000"

# Keys: format is API_KEY: API_SECRET
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

# Egress — write audio files to Railway Volume
egress:
  redis:
    address: ${REDIS_ADDRESS}
    password: ${REDIS_PASSWORD}

# Logging
logging:
  level: info
  pion_level: error

# Room limits
room:
  max_participants: 7
  empty_timeout: 300  # 5 minutes


